<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Dispatch Details - RouteForge</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous"
    />

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        defer>
    </script>

    <script src="dispatch-details.js" defer></script>
    <script src="../../helper.js" defer></script>

    <style>
        body {
            background: #f5f7fa;
        }

        .page-header {
            margin-bottom: 2rem;
        }

        .details-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .details-row {
            padding: 12px 0;
            border-bottom: 1px solid #e9ecef;
        }

        .details-row:last-child {
            border-bottom: none;
        }

        .details-label {
            font-weight: 600;
            color: #495057;
        }

        .details-value {
            color: #212529;
        }

        #map {
            height: 500px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }
    </style>
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg bg-white border-bottom">
        <div class="container-fluid px-4">

            <a
                class="navbar-brand fw-bold"
                href="../home/home.html">
                RouteForge
            </a>

            <div class="navbar-nav ms-auto">
                <a
                    class="nav-link"
                    href="../home/home.html">
                    Home
                </a>

                <a
                    class="nav-link"
                    href="../dispatch/dispatch.html">
                    Dispatches
                </a>
            </div>

        </div>
    </nav>

    <!-- Main Content -->
    <main class="container py-5">

        <div class="page-header">
            <h1 class="fw-bold">Dispatch Details</h1>

            <p class="text-secondary mb-0">
                View delivery information, customer details, and destination location.
            </p>
        </div>

        <!-- Dispatch Details -->
        <div class="card details-card mb-4">

            <div class="card-body p-4">

                <div class="d-flex justify-content-between align-items-center mb-4">

                    <div>
                        <h3
                            class="fw-bold mb-1"
                            id="dispatch-title">
                            Dispatch Details
                        </h3>

                        <span class="badge text-bg-primary">
                            Delivery Dispatch
                        </span>
                    </div>

                    <a
                        href="../dispatch/dispatch.html"
                        class="btn btn-outline-secondary">
                        Back to Dispatches
                    </a>

                </div>

                <div id="dispatch-details">

                    <div class="text-center py-4">
                        <div
                            class="spinner-border text-primary"
                            role="status">
                        </div>

                        <p class="text-secondary mt-2 mb-0">
                            Loading dispatch details...
                        </p>
                    </div>

                </div>

            </div>

        </div>

        <!-- Map -->
        <div class="card details-card">

            <div class="card-body p-3">

                <h4 class="fw-bold px-2 pt-2 mb-3">
                    Delivery Location
                </h4>

                <div id="map"></div>

            </div>

        </div>

    </main>

</body>

</html>
