<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    />

    <title>Dispatches - RouteForge</title>

    <style>
        body {
            background: #f4f7fb;
        }

        .page-header {
            margin-top: 50px;
            margin-bottom: 30px;
        }

        .page-header h1 {
            font-weight: 700;
        }

        .dispatch-card {
            height: 100%;
            border: none;
            border-radius: 16px;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.07);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .dispatch-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
        }

        .dispatch-id {
            font-weight: 700;
        }

        .info-label {
            font-weight: 600;
        }

        .coordinate-text {
            font-size: 0.9rem;
            color: #6c757d;
        }
    </style>
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg bg-white border-bottom">

        <div class="container">

            <a
                class="navbar-brand fw-bold"
                href="../home/home.html">
                RouteForge
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent"
                aria-expanded="false"
                aria-label="Toggle navigation">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div
                class="collapse navbar-collapse justify-content-end"
                id="navbarSupportedContent">

                <ul class="navbar-nav">

                    <li class="nav-item">
                        <a
                            class="nav-link active"
                            href="../home/home.html">
                            Home
                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>


    <!-- Main Content -->
    <main class="container">

        <div
            class="page-header d-flex justify-content-between align-items-center">

            <div>

                <h1>
                    Dispatch Management
                </h1>

                <p class="text-muted mb-0">
                    View and manage delivery dispatches.
                </p>

            </div>

            <a
                href="../add-dispatch/add-dispatch.html"
                class="btn btn-success">

                + Add Dispatch

            </a>

        </div>


        <!-- Dispatch Cards -->
        <div
            class="row g-4"
            id="dispatch-container">
        </div>

    </main>


    <script src="dispatch.js"></script>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
